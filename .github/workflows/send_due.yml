name: 알림 메일 보내기

on:
  workflow_dispatch: # Actions 탭에서 수동 실행
  # 저장소 Settings > Secrets and variables > Actions에 아래 비밀값을 넣은 뒤 주석을 풀어 주세요.
  # GitHub의 예약 실행은 몇 분 늦을 수 있어요.
  # schedule:
  #   - cron: "*/5 * * * *"

concurrency:
  group: send-due-mails # 앞 실행이 끝나기 전에 겹쳐 돌지 않게 한다 (같은 메일 중복 방지)

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m mailer.send_due
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          APP_URL: ${{ secrets.APP_URL }}
